<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>POKEWAY SURF — © dev Kikyo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-wrap">
    <header><div class="brand">⚡ POKÉWAY SURF</div><div id="score">0 m · 0 coins</div></header>
    <canvas id="game" aria-label="Pokeway Surf game"></canvas>
    <section id="overlay" class="overlay">
      <div class="panel">
        <div class="logo">⚡</div>
        <h1>POKÉWAY SURF</h1>
        <p>Run, dodge trains, collect PokéCoins — don't let Arceus catch you!</p>
        <button id="start">START SURFING</button>
        <small>Swipe / arrow keys: move · Up: jump · Down: slide</small>
      </div>
    </section>
    <footer>© dev Kikyo</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
